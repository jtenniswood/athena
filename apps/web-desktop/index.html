<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/hermes.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/hermes.png" />
    <link rel="apple-touch-icon" href="/hermes.png" />
    <title>Hermes Web</title>
    <!-- Keep the loading screen styled before the entry module loads. -->
    <style>
      .hermes-startup-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        color: light-dark(#626a78, #a9afbb);
        background: var(--hermes-boot-background, Canvas);
      }
      .hermes-startup-logo {
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      .hermes-startup-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2px solid color-mix(in srgb, currentColor 20%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: hermes-startup-spin 0.8s linear infinite;
      }
      .hermes-startup-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes hermes-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hermes-startup-spinner { animation: none; }
      }
    </style>
    <!-- Docker replaces this with the configured gateway origin at startup. -->
    <script src="/gateway-config.js"></script>
    <script src="/runtime-config.js"></script>
    <script>
      // Pre-paint the themed background before the app bundle loads (mirrors
      // apps/desktop/index.html; avoids the white flash).
      try {
        let bg = localStorage.getItem('hermes-boot-background')
        let scheme = localStorage.getItem('hermes-boot-color-scheme')
        if (!bg) {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          bg = dark ? '#111111' : '#f7f7f7'
          scheme = dark ? 'dark' : 'light'
        }
        document.documentElement.style.backgroundColor = bg
        document.documentElement.style.setProperty('--hermes-boot-background', bg)
        if (scheme === 'dark' || scheme === 'light') {
          document.documentElement.style.colorScheme = scheme
        }
      } catch {
        // localStorage unavailable — keep UA defaults.
      }
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt">
      <div class="hermes-startup-loading" role="status">
        <img class="hermes-startup-logo" src="/hermes.svg" width="64" height="64" alt="" aria-hidden="true" />
        <span class="hermes-startup-spinner" aria-hidden="true"></span>
        <span class="hermes-startup-label">Loading Hermes…</span>
      </div>
    </div>
    <script>
      // Keep a useful fallback if the entry module itself cannot be evaluated.
      // This intentionally has no renderer or gateway dependency.
      if (typeof window.addEventListener === 'function') {
        window.addEventListener('error', event => {
          if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return
          const root = document.getElementById('root')
          if (!root || root.querySelector('.hermes-startup-recovery')) return
          root.innerHTML = '<main class="hermes-startup-recovery" role="alert"><h1>Hermes could not load the browser interface.</h1><p>Reload once to retry the current build.</p><div class="hermes-startup-recovery-actions"><button type="button" onclick="location.reload()">Retry</button></div></main>'
        })
      }
    </script>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>

name: quick-image-build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image and tags
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:latest"
            echo "$image:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "$image:main"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:${GITHUB_REF#refs/tags/v}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=stable
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.release.channel=stable

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Trigger Komodo redeployment
        env:
          KOMODO_WEBHOOK_URL: ${{ vars.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          case "$KOMODO_WEBHOOK_URL" in
            https://*/listener/github/stack/*/deploy) ;;
            *) echo 'KOMODO_WEBHOOK_URL must be an HTTPS Komodo stack deploy listener URL' >&2; exit 1 ;;
          esac
          test -n "$KOMODO_WEBHOOK_SECRET" || { echo 'Missing secret KOMODO_WEBHOOK_SECRET' >&2; exit 1; }
          test -n "$CF_ACCESS_CLIENT_ID" || { echo 'Missing secret CF_ACCESS_CLIENT_ID' >&2; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo 'Missing secret CF_ACCESS_CLIENT_SECRET' >&2; exit 1; }

          payload=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF"], "after": os.environ["GITHUB_SHA"], "repository": {"default_branch": os.environ["GITHUB_REF_NAME"]}}, separators=(",", ":")))')
          signature=$(PAYLOAD="$payload" python3 -c 'import hashlib, hmac, os; print(hmac.new(os.environ["KOMODO_WEBHOOK_SECRET"].encode(), os.environ["PAYLOAD"].encode(), hashlib.sha256).hexdigest())')
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT

          http_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            -X POST "$KOMODO_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: GitHub-Hookshot/hermes-actions' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'X-GitHub-Event: push' \
            -H "X-GitHub-Delivery: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$payload")

          [[ "$http_code" =~ ^2[0-9][0-9]$ ]] || {
            printf 'Komodo webhook returned HTTP %s\n' "$http_code" >&2
            test ! -s "$response" || sed -n '1,20p' "$response" >&2
            exit 1
          }
          test ! -s "$response" || {
            echo 'Komodo webhook returned an unexpected response body' >&2
            sed -n '1,20p' "$response" >&2
            exit 1
          }

          printf 'Komodo accepted the signed redeploy webhook for `%s` (`%s`).\n' \
            "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

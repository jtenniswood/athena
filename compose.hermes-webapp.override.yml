# Add this file to the EXISTING Hermes server stack, alongside its Compose file.
# Rename the service key if the existing Hermes service is not named "hermes".
services:
  hermes:
    image: ${ATHENA_HERMES_IMAGE:-ghcr.io/jtenniswood/athena-hermes:dev-latest}
    # The image's upstream bootstrap runs the gateway as the Hermes user.
    user: "0:0"
    init: false
    entrypoint: null
    command: ["gateway", "run"]
    ports:
      - "${HERMES_WEBAPP_PORT:-9120}:${HERMES_WEBAPP_PORT:-9120}"
    environment:
      # Keep the previous dashboard available during the listener migration.
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_WEBAPP_ENABLED: ${HERMES_WEBAPP_ENABLED:-true}
      HERMES_WEBAPP_HOST: ${HERMES_WEBAPP_HOST:-0.0.0.0}
      HERMES_WEBAPP_PORT: ${HERMES_WEBAPP_PORT:-9120}
      # Required when enabled. ATHENA_PUBLIC_URL remains an accepted alias.
      HERMES_WEBAPP_PUBLIC_URL: ${HERMES_WEBAPP_PUBLIC_URL:-${ATHENA_PUBLIC_URL:-}}

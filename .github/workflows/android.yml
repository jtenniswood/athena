name: Android app
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web-desktop/src/platform/android*'
      - 'apps/web-desktop/src/experience/settings-menu.tsx'
      - 'apps/web-desktop/src/entry.ts'
      - 'scripts/android*'
      - 'scripts/firebase-messaging*'
      - 'nginx.conf.template'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify Gradle wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Test, lint and build APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the real WebView bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Preserve emulator test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-reports
          path: apps/android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: athena-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

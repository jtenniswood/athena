<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/athena.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/athena.png" />
    <link rel="apple-touch-icon" href="/athena.png" />
    <title>Athena for Hermes Agent</title>
    <!-- Keep the loading screen styled before the entry module loads. -->
    <style>
      .hermes-startup-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        color: light-dark(#626a78, #a9afbb);
        background: var(--hermes-boot-background, Canvas);
      }
      .hermes-startup-logo {
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      .hermes-startup-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2px solid color-mix(in srgb, currentColor 20%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: hermes-startup-spin 0.8s linear infinite;
      }
      .hermes-startup-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes hermes-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hermes-startup-spinner { animation: none; }
      }
    </style>
    <!-- Docker replaces this with the configured gateway origin at startup. -->
    <script src="/gateway-config.js"></script>
    <!-- Bypass a stale service-worker precache from older installed builds. -->
    <script src="/runtime-config.js?hermes-runtime=1"></script>
    <script>
      // Pre-paint the themed background before the app bundle loads (mirrors
      // apps/desktop/index.html; avoids the white flash).
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      let bg = dark ? '#111111' : '#f7f7f7'
      let scheme = dark ? 'dark' : 'light'
      try {
        const savedBg = localStorage.getItem('hermes-boot-background')
        const savedScheme = localStorage.getItem('hermes-boot-color-scheme')
        if (savedBg && (savedScheme === 'dark' || savedScheme === 'light')) {
          bg = savedBg
          scheme = savedScheme
        } else if (savedBg) {
          // Older themes saved only the background. Infer its scheme so a
          // dark saved background cannot inherit light-mode sign-in text.
          const hex = savedBg.match(/^#([\da-f]{3}|[\da-f]{6})$/i)?.[1]
          const rgb = savedBg.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/)
          const fullHex = hex?.length === 3 ? [...hex].map(value => value + value).join('') : hex
          const channels = fullHex ? [0, 2, 4].map(offset => parseInt(fullHex.slice(offset, offset + 2), 16)) : rgb?.slice(1, 4).map(Number)
          if (channels) {
            const linear = channels.map(value => value / 255 <= .04045 ? value / 255 / 12.92 : ((value / 255 + .055) / 1.055) ** 2.4)
            scheme = linear[0] * .2126 + linear[1] * .7152 + linear[2] * .0722 < .179 ? 'dark' : 'light'
            bg = savedBg
          }
        }
      } catch {
        // Browser storage is optional; keep the system theme defaults.
      }
      document.documentElement.style.backgroundColor = bg
      document.documentElement.style.setProperty('--hermes-boot-background', bg)
      document.documentElement.style.colorScheme = scheme
      document.documentElement.dataset.athenaBootScheme = scheme
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt">
      <div class="hermes-startup-loading" role="status">
        <img class="hermes-startup-logo" src="/athena.svg" width="64" height="64" alt="" aria-hidden="true" />
        <span class="hermes-startup-spinner" aria-hidden="true"></span>
        <span class="hermes-startup-label">Loading Hermes…</span>
      </div>
    </div>
    <script>
      // Keep a useful fallback if the entry module itself cannot be evaluated.
      // This intentionally has no renderer or gateway dependency.
      if (typeof window.addEventListener === 'function') {
        window.addEventListener('error', event => {
          if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return
          const root = document.getElementById('root')
          if (!root || root.querySelector('.hermes-startup-recovery')) return
          root.innerHTML = '<main class="hermes-startup-recovery" role="alert"><h1>Hermes could not load the browser interface.</h1><p>Reload once to retry the current build.</p><div class="hermes-startup-recovery-actions"><button type="button" onclick="location.reload()">Retry</button></div></main>'
        })
      }
    </script>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>

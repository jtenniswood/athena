name: Remote gateway integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.hermes'
      - 'hermes-release.json'
      - 'flake.lock'
      - 'pnpm-lock.yaml'
      - 'apps/web-desktop/**'
      - 'docker/**'
      - 'scripts/**'
      - 'tests/browser/remote-gateway.spec.mjs'
      - '.github/workflows/remote-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  remote-gateway:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm prepare:renderer
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:official-release
      - run: python3 docker/test_configure_hermes_webapp.py
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the UI-only image
        run: docker build --build-arg HERMES_WRAPPER_REV="$GITHUB_SHA" --build-arg HERMES_RELEASE_CHANNEL=review -t athena:gateway-review .
      - name: Build the Hermes server image
        run: docker build -f Dockerfile.hermes --build-arg HERMES_IMAGE="$(node -p 'require("./hermes-release.json").gatewayImage')" -t athena:hermes-review .
      - name: Start an isolated gateway and local model
        run: |
          mkdir -p test-results/remote/home/profiles/research
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const model = { default: 'athena-test-model', provider: 'custom', base_url: 'http://athena-review-model:4191/v1', api_key: 'local-review-fixture', api_mode: 'chat_completions' }
          writeFileSync('test-results/remote/home/config.yaml', JSON.stringify({
            model, webapp: { enabled: false, trusted_proxies: ['127.0.0.1'] }
          }))
          writeFileSync('test-results/remote/home/profiles/research/config.yaml', JSON.stringify({ model, webapp: { enabled: false } }))
          writeFileSync('test-results/remote/home/profiles/research/SOUL.md', 'You are a local review profile.\n')
          JS
          docker network create athena-remote-review
          docker run -d --name athena-review-model --network athena-remote-review \
            --entrypoint node -e HOST=0.0.0.0 \
            -v "$PWD/scripts/preview/model.mjs:/model.mjs:ro" athena:gateway-review /model.mjs
          docker create --name athena-review-gateway --network athena-remote-review \
            -e HERMES_HOME=/opt/data \
            -e HERMES_WEBAPP_PUBLIC_URL=http://localhost:4190 \
            -e HERMES_DASHBOARD_BASIC_AUTH_USERNAME=reviewer \
            -e HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=athena-local-review-fixture \
            -e HERMES_DASHBOARD_BASIC_AUTH_SECRET=athena-local-review-session-fixture \
            athena:hermes-review
          docker cp test-results/remote/home/. athena-review-gateway:/opt/data/
          docker start athena-review-gateway
          docker exec athena-review-gateway cat /opt/hermes/install-stamp.json > test-results/remote/install-stamp.json
          node -e 'const fs=require("fs"); if(JSON.parse(fs.readFileSync("test-results/remote/install-stamp.json")).commit !== require("./hermes-release.json").revision) throw new Error("Gateway fixture revision differs from the release pin")'
          docker run -d --name athena-review-ui --network athena-remote-review \
            -p 127.0.0.1:4190:80 \
            -e HERMES_GATEWAY_URL=http://athena-review-gateway:9120 \
            athena:gateway-review
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4190/login > /dev/null; then
              docker exec athena-review-gateway /opt/hermes/.venv/bin/python -c 'import yaml; c=yaml.safe_load(open("/opt/data/config.yaml")); assert c["model"]["api_key"] == "local-review-fixture"; assert c["webapp"]["enabled"] is True; assert c["webapp"]["trusted_proxies"] == ["127.0.0.1"]'
              exit 0
            fi
            sleep 2
          done
          docker logs athena-review-ui
          exit 1
      - name: Check real gateway chat, drafts, uploads and preferences
        env:
          ATHENA_GATEWAY_TEST_URL: http://localhost:4190
        run: pnpm exec playwright test tests/browser/remote-gateway.spec.mjs --project=chromium --reporter=line
      - name: Preserve diagnostics and stop only the test containers
        if: always()
        run: |
          mkdir -p test-results/remote
          docker logs athena-review-ui > test-results/remote/ui.log 2>&1 || true
          docker logs athena-review-gateway > test-results/remote/gateway.log 2>&1 || true
          docker logs athena-review-model > test-results/remote/model.log 2>&1 || true
          docker rm -fv athena-review-ui athena-review-gateway athena-review-model || true
          docker network rm athena-remote-review || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: remote-gateway-diagnostics
          path: test-results/
          retention-days: 7

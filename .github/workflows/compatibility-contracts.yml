name: Athena RUNNER migration canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-canary:
    runs-on: [self-hosted, runner-athena]
    timeout-minutes: 5
    steps:
      - name: Verify exact runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = runner-athena
          test "$RUNNER_OS" = Linux
          test "$REPO_URL" = https://github.com/jtenniswood/athena
          test -x /opt/runner-hooks/cleanup.sh
          test "$RUNNER_CLEANUP_DOCKER" = false
          test -z "${ACCESS_TOKEN:-}"
          test "$(stat -f -c %T /runner-work/athena)" = ext2/ext3
          printf 'Athena runner identity and disk-backed workspace verified\n'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify real checkout and disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git rev-parse --is-inside-work-tree
          test -f README.md
          printf 'Athena runner canary\n' > "$RUNNER_TEMP/athena-canary.txt"
          test -s "$RUNNER_TEMP/athena-canary.txt"
          df -B1 /runner-work/athena
          printf 'Checkout and workspace write test passed\n'

name: compatibility-contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  renderer-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Prepare pinned renderer
        run: pnpm prepare:renderer
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify renderer dependency baseline
        run: pnpm check:renderer-dependencies
      - name: Verify image publication channels
        run: node --test scripts/image-publication.test.mjs
      - name: Verify compatibility registry
        run: node --test scripts/compatibility-registry.test.mjs
      - name: Typecheck browser and renderer integration
        run: pnpm typecheck
      - name: Verify shared adapter output and startup ordering
        run: node --test scripts/renderer-adapter.test.mjs scripts/inspect-renderer.test.mjs scripts/sidebar-controller.test.mjs scripts/startup.test.mjs scripts/state-safety.test.mjs scripts/settings-save.test.mjs scripts/settings-presentation.test.mjs scripts/config-field-presentation.test.mjs scripts/pending-work.test.mjs scripts/verify-behavior.test.mjs scripts/runtime-services.test.mjs
      - name: Verify affected declared Node scenarios
        id: behavior
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node scripts/verify-behavior.mjs --changed "$BASE_SHA" --runner node --list --output test-results/behavior-plan.json > /dev/null
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          const plan = JSON.parse(readFileSync('test-results/behavior-plan.json', 'utf8'))
          const critical = new Set(['bot-session-cancellation', 'single-conversation-wiring', 'browser-root', 'browser-profile-selection', 'browser-group-selection', 'browser-created-group-selection'])
          appendFileSync(process.env.GITHUB_OUTPUT, `selection=${plan.entries.some(name => critical.has(name))}\n`)
          if (plan.requested.length) {
            const result = spawnSync(process.execPath, ['scripts/verify-behavior.mjs', '--changed', process.env.BASE_SHA, '--runner', 'node', '--run', '--output', 'test-results/behavior-node.json'], { encoding: 'utf8' })
            if (result.error) throw result.error
            if (result.status !== 0) { console.error(result.stdout, result.stderr); process.exit(result.status || 1) }
            const report = JSON.parse(readFileSync('test-results/behavior-node.json', 'utf8'))
            console.log(`${report.observed.length} Node tests executed for ${report.requested.length} declared scenarios.`)
          } else console.log('No declared Node scenarios were selected by this diff.')
          JS
      - name: Verify persisted preference compatibility
        run: node --test scripts/browser-preference-contract.test.mjs scripts/preference-sync.test.mjs scripts/preferences-server.test.mjs scripts/default-profile-route.test.mjs scripts/sidebar-contracts.test.mjs
      - name: Verify Android bridge, sign-in and background notifications
        run: node --test scripts/android-*.test.mjs scripts/firebase-messaging.test.mjs scripts/browser-notifications.test.mjs scripts/action-surface.test.mjs
      - name: Install browser for Android approval regression checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Android approval forms and settings in a real browser
        run: |
          test_files=(tests/browser/android-sign-in.spec.mjs tests/browser/native-settings.spec.mjs tests/browser/settings-presentation.spec.mjs tests/browser/session-row.spec.mjs tests/browser/sidebar-tree.spec.mjs tests/browser/pull-to-refresh.spec.mjs tests/browser/timeline-scrubbing.spec.mjs)
          for file in "${test_files[@]}"; do
            test -f "$file" || { echo "Missing browser test file: $file" >&2; exit 1; }
          done
          pnpm exec playwright test "${test_files[@]}" --project=chromium --reporter=line
      - name: Build browser application
        run: pnpm build
      - name: Verify composer keyboard ownership in the built application
        run: pnpm exec playwright test tests/browser/composer-keyboard.spec.mjs --project=chromium --reporter=line
      - name: Build isolated conversation fixture
        if: steps.behavior.outputs.selection == 'true'
        run: docker build -t athena:compatibility .
      - name: Verify selection races through their registry entry
        if: steps.behavior.outputs.selection == 'true'
        env:
          HERMES_TEST_IMAGE: athena:compatibility
        run: node scripts/verify-behavior.mjs --entry bot-session-cancellation --runner browser --run --output test-results/behavior-selection.json
      - name: Preserve selected behavior plans and execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-behavior
          path: test-results/behavior-*.json
          if-no-files-found: ignore
          retention-days: 14

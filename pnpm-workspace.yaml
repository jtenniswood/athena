packages:
  - apps/web-desktop

# Keep installs aligned with Renovate's npm release cooldown.
minimumReleaseAge: 1440

# pnpm 11 blocks postinstall build scripts by default; approve the ones the
# web closure needs.
onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"

# Hoisted node_modules layout — our vite config aliases expect react etc. at
# the repo-root node_modules (same shape as npm).
nodeLinker: hoisted

# The pinned renderer's read-only plugin store does not implement the eq()
# method required by Nanostores 1.5. Keep its shared store API consistent.
overrides:
  nanostores: 1.5.5

allowBuilds:
  get-windows: false
  node-pty: false
  unicode-animations: false

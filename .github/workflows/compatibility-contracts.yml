name: compatibility-contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  renderer-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Prepare pinned renderer
        run: pnpm prepare:renderer
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify renderer dependency baseline
        run: pnpm check:renderer-dependencies
      - name: Verify image publication channels
        run: node --test scripts/image-publication.test.mjs
      - name: Verify compatibility registry
        run: node --test scripts/compatibility-registry.test.mjs
      - name: Typecheck browser and renderer integration
        run: pnpm typecheck
      - name: Verify shared adapter output and startup ordering
        run: node --test scripts/renderer-adapter.test.mjs scripts/startup.test.mjs
      - name: Verify persisted preference compatibility
        run: node --test scripts/browser-preference-contract.test.mjs scripts/preference-sync.test.mjs scripts/preferences-server.test.mjs scripts/default-profile-route.test.mjs scripts/sidebar-contracts.test.mjs
      - name: Verify Android bridge, sign-in and background notifications
        run: node --test scripts/android-*.test.mjs scripts/firebase-messaging.test.mjs scripts/browser-notifications.test.mjs scripts/action-surface.test.mjs
      - name: Install browser for Android approval regression checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Android approval forms and native menus in a real browser
        run: pnpm exec playwright test tests/browser/android-sign-in.spec.mjs tests/browser/native-menus.spec.mjs tests/browser/pull-to-refresh.spec.mjs --project=chromium --reporter=line
      - name: Build browser application
        run: pnpm build

name: Build development image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Publish both images, the UI only, or the Hermes server only
        type: choice
        options: [both, ui, hermes]
        default: both
permissions:
  contents: read
  packages: write
concurrency:
  group: development-image-publication-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image and tags
        id: identity
        run: node scripts/image-publication.mjs --github-output --development
      - name: Build and publish amd64 image
        if: inputs.image != 'hermes'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=${{ steps.identity.outputs.channel }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.release.channel=${{ steps.identity.outputs.channel }}
      - name: Identify Hermes server image
        if: inputs.image != 'ui'
        id: hermes_identity
        run: node scripts/image-publication.mjs --github-output --development --hermes
      - name: Build and publish Hermes server image
        if: inputs.image != 'ui'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hermes
          push: true
          platforms: linux/amd64
          tags: ${{ steps.hermes_identity.outputs.tags }}
          build-args: |
            HERMES_IMAGE=${{ steps.hermes_identity.outputs.upstream_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.upstream.revision=${{ steps.hermes_identity.outputs.upstream_revision }}
            io.hermes.release.channel=${{ steps.hermes_identity.outputs.channel }}

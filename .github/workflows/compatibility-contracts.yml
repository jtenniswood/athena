name: compatibility-contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare pinned renderer
        run: pnpm prepare:renderer
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify compatibility registry
        run: node --test scripts/compatibility-registry.test.mjs

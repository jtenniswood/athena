name: Build development image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: development-image-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image and tags
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:dev-latest"
            echo "$image:dev-sha-${GITHUB_SHA}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=development
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.release.channel=development

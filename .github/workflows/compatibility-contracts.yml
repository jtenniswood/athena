name: compatibility-contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  renderer-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare pinned renderer
        run: pnpm prepare:renderer
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify compatibility registry
        run: node --test scripts/compatibility-registry.test.mjs
